<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat — agente cotação</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #fff;
      --ink: #1a1d21;
      --muted: #5c6570;
      --line: #d8dee6;
      --accent: #0b6e4f;
      --accent-ink: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 1.5rem 1rem 3rem;
    }
    main {
      width: min(640px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.25rem;
      display: grid;
      gap: 0.85rem;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
    }
    p.hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    label {
      display: grid;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    input, textarea {
      width: 100%;
      font: inherit;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      background: #fff;
    }
    textarea { min-height: 96px; resize: vertical; }
    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-ink);
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    button.secondary {
      background: #e8ecf1;
      color: var(--ink);
    }
    #out {
      min-height: 140px;
      white-space: pre-wrap;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.75rem;
      background: #fafbfc;
    }
    #meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    #err {
      color: #9b1c1c;
      font-size: 0.9rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Teste do agente</h1>
    <p class="hint">Digite como lead → envia <code>POST /chat</code> → mostra a resposta.</p>

    <label>
      conversation_id
      <input id="cid" type="text" value="ui-demo" autocomplete="off" />
    </label>

    <label>
      Mensagem
      <textarea id="msg" placeholder="tenho 35 anos, Gol 2020, plano essencial, cep 01310100"></textarea>
    </label>

    <div class="row">
      <button id="send" type="button">Enviar</button>
      <button id="novo" class="secondary" type="button">Nova conversa</button>
    </div>

    <label>
      Resposta do agente
      <div id="out" aria-live="polite"></div>
    </label>
    <div id="meta"></div>
    <div id="err"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function novoId() {
      return "ui-" + Date.now().toString(36);
    }

    $("novo").onclick = () => {
      $("cid").value = novoId();
      $("out").textContent = "";
      $("meta").textContent = "";
      $("err").textContent = "";
      $("msg").focus();
    };

    async function enviar() {
      const mensagem = $("msg").value.trim();
      const conversation_id = $("cid").value.trim() || novoId();
      $("cid").value = conversation_id;
      $("err").textContent = "";
      if (!mensagem) {
        $("err").textContent = "Digite uma mensagem.";
        return;
      }
      $("send").disabled = true;
      $("out").textContent = "…";
      $("meta").textContent = "";
      try {
        const r = await fetch("/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ conversation_id, mensagem }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          $("out").textContent = "";
          $("err").textContent = "HTTP " + r.status + ": " + (data.detail || JSON.stringify(data));
          return;
        }
        $("out").textContent = data.mensagem || "(sem mensagem)";
        const acao = data.decisao && data.decisao.acao;
        $("meta").textContent = [
          "turno " + (data.turno ?? "?"),
          "estágio " + (data.estagio ?? "?"),
          acao ? "ação " + acao : null,
        ].filter(Boolean).join(" · ");
        $("msg").value = "";
        $("msg").focus();
        if (acao === "emitir_apolice") {
          $("meta").textContent += " · fechamento (boleto/apólice)";
        }
      } catch (e) {
        $("out").textContent = "";
        $("err").textContent = String(e);
      } finally {
        $("send").disabled = false;
      }
    }

    $("send").onclick = enviar;
    $("msg").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) {
        ev.preventDefault();
        enviar();
      }
    });
  </script>
</body>
</html>
